[extend]
useDefault = true

[allowlist]
description = "Repository-wide false positives and generated output"
regexTarget = "match"
paths = [
  '''(?:^|/)coverage(?:/|$)''',
  '''(?:^|/)coverage-[^/]+(?:/|$)''',
  '''(?:^|/)dist(?:/|$)''',
  '''(?:^|/)node_modules(?:/|$)''',
]
regexes = [
  # Public Anthropic `anthropic-beta` protocol flag name, not a credential.
  '''oauth-2025-04-20''',
]
